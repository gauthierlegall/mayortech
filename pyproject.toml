[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "travaux-mairie"
version = "0.8.1"
description = "Pilote de suivi des travaux municipaux avec mémoire sourcée et validation humaine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "markdown-it-py>=4,<5",
    "pycasbin==2.8.0",
    "cryptography==50.0.2",
    "icalendar==7.3.0",
    "joserfc==1.8.0",
]

[project.optional-dependencies]
exchange = ["exchangelib>=5.6,<6"]
calendars = ["caldav==3.7.0"]
documents = ["pypdf>=6,<7", "python-docx>=1.2,<2"]
signature = ["SpiffWorkflow==3.2.0"]
dev = ["pytest==9.1.1", "ruff>=0.14,<1", "playwright>=1.58,<2"]
appflowy = [
    "mcp>=2,<3",
]

[project.scripts]
travaux = "travaux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/travaux"]

[tool.hatch.build.targets.wheel.force-include]
web = "travaux/web"
"native-editor/dist" = "travaux/native-editor"

[tool.hatch.build.targets.sdist.force-include]
web = "web"
"native-editor/dist" = "native-editor/dist"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
