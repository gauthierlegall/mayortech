name: mayortech-private
x-log: &logs
  driver: json-file
  options: {max-size: "5m", max-file: "2"}
x-app: &app
  image: travaux-mairie:0.8.1-20261117T221755Z-6082cd
  pull_policy: never
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  tmpfs: ["/tmp:size=64m,noexec,nosuid,nodev"]
  env_file: [./private/app.env]
  volumes:
    - data:/data
    - ./private/connector-vault.keys:/run/secrets/connector-vault.keys:ro
  labels: {io.kerforge.application: mayortech-private, io.kerforge.environment: staging-fictional}
  logging: *logs
services:
  postgres:
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    pull_policy: never
    restart: unless-stopped
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./private/postgres.env]
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30, -c, work_mem=2MB]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
      - /var/run/postgresql:size=8m,noexec,nosuid,nodev,uid=70,gid=70,mode=3775
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: 256m
    cpus: "0.35"
    pids_limit: 80
    healthcheck:
      test: [CMD, pg_isready, -U, keycloak, -d, keycloak]
      interval: 10s
      timeout: 4s
      retries: 12
    labels: {io.kerforge.application: mayortech-private}
    logging: *logs
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    pull_policy: never
    restart: unless-stopped
    command: [start, --import-realm]
    user: "1000:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./private/keycloak.env]
    volumes:
      - identity:/opt/keycloak/data
      - ./private/mayortech-realm.json:/opt/keycloak/data/import/mayortech-realm.json:ro
      - ./theme.jar:/opt/keycloak/providers/mayortech-theme.jar:ro
      - ./keycloak-healthcheck.sh:/opt/keycloak/keycloak-healthcheck.sh:ro
    tmpfs: ["/tmp:size=96m,nosuid,nodev"]
    networks:
      database: {}
      identity_front: {aliases: [mayortech-keycloak]}
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 768m
    cpus: "0.75"
    pids_limit: 180
    healthcheck:
      test: [CMD, /bin/bash, /opt/keycloak/keycloak-healthcheck.sh]
      start_period: 180s
      interval: 15s
      timeout: 6s
      retries: 14
    labels: {io.kerforge.application: mayortech-private}
    logging: *logs
  identity_guard:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    pull_policy: never
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    volumes: [./identity-nginx.rendered.conf:/etc/nginx/nginx.conf:ro]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev,mode=1777", "/var/cache/nginx:size=16m,noexec,nosuid,nodev,mode=1777"]
    networks:
      identity_front: {}
      caddy: {aliases: [mayortech-identity-guard]}
    depends_on: {keycloak: {condition: service_healthy}}
    mem_limit: 64m
    cpus: "0.15"
    pids_limit: 40
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/guard-health]
      interval: 10s
      timeout: 4s
      retries: 8
    labels: {io.kerforge.application: mayortech-private}
    logging: *logs
  app:
    <<: *app
    mem_limit: 384m
    cpus: "0.5"
    networks: {caddy: {aliases: [mayortech-private-app]}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/health/live',headers={'Host':'espace.kerforge.com'}),timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  worker:
    <<: *app
    command: [python, -m, travaux, worker]
    mem_limit: 128m
    cpus: "0.2"
    network_mode: none
    volumes:
      - data:/data
      - ./private/connector-vault.keys:/run/secrets/connector-vault.keys:ro
      - ./worker-healthcheck.py:/run/worker-healthcheck.py:ro
    depends_on: {app: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, /run/worker-healthcheck.py]
      interval: 20s
      timeout: 5s
      retries: 6
volumes:
  data:
    name: mayortech-private-data
    labels: {io.kerforge.application: mayortech-private}
  postgres:
    name: mayortech-private-postgres
    labels: {io.kerforge.application: mayortech-private}
  identity:
    name: mayortech-private-identity
    labels: {io.kerforge.application: mayortech-private}
networks:
  database: {name: mayortech-private-database, internal: true, labels: {io.kerforge.application: mayortech-private}}
  identity_front: {name: mayortech-private-identity-front, labels: {io.kerforge.application: mayortech-private}}
  caddy: {name: caddy_net, external: true}
