# Replace both placeholders before nginx -t. Only the exact, inspected Caddy
# peer IP is trusted. No passwords, tokens or realm JSON belong in this file.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    access_log off;
    merge_slashes on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # $uri is Nginx's decoded, normalized path; query strings never enter keys
    # or logs. Static assets and ordinary GET login pages are outside budgets.
    map $uri $guard_auth_path {
        default 0;
        ~*^/realms/mayortech/(login-actions/|protocol/openid-connect/(auth|registrations)(/|$)) 1;
    }
    map "$request_method:$guard_auth_path" $guard_auth_key {
        default "";
        "POST:1" $binary_remote_addr;
    }
    map $uri $guard_email_path {
        default 0;
        ~*^/realms/mayortech/login-actions/(registration|reset-credentials|required-action)(/|$) 1;
    }
    map "$request_method:$guard_email_path" $guard_email_key {
        default "";
        ~^(GET|HEAD|POST):1$ $binary_remote_addr;
    }
    map "$request_method:$guard_email_path" $guard_email_global_key {
        default "";
        ~^(GET|HEAD|POST):1$ "mayortech-email";
    }

    limit_req_zone $guard_auth_key zone=mayortech_auth:1m rate=60r/m;
    limit_req_zone $guard_email_key zone=mayortech_email:1m rate=6r/m;
    limit_req_zone $guard_email_global_key zone=mayortech_email_global:1m rate=30r/m;

    server {
        listen 8080;
        server_name identite.kerforge.com;
        set_real_ip_from __CADDY_TRUSTED_IP__;
        real_ip_header X-MayorTech-Client-IP;
        real_ip_recursive off;

        # Matrix parameters are unnecessary here and can otherwise change how
        # Java HTTP routing sees a path. Return-only Nginx if has no rewrite.
        if ($uri ~ ";") { return 404; }

        limit_req_status 429;
        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header Retry-After 60 always;
            add_header Cache-Control "no-store" always;
            default_type "text/plain; charset=utf-8";
            return 429 "Trop de tentatives. Patientez une minute puis réessayez.\n";
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host identite.kerforge.com;
        proxy_set_header X-Forwarded-Host identite.kerforge.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-MayorTech-Client-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location = /guard-health {
            # Inspect the original TCP peer, before any real-IP substitution.
            # This route is for the container's loopback healthcheck only.
            if ($realip_remote_addr != 127.0.0.1) { return 404; }
            default_type text/plain;
            return 200 "ok\n";
        }
        location /resources/ {
            proxy_pass http://__KEYCLOAK_UPSTREAM__;
        }
        location /realms/mayortech/ {
            limit_req zone=mayortech_auth burst=20 nodelay;
            limit_req zone=mayortech_email burst=3 nodelay;
            limit_req zone=mayortech_email_global burst=10 nodelay;
            proxy_pass http://__KEYCLOAK_UPSTREAM__;
        }
        # No console, master realm, health port or other realm is exposed.
        location / {
            return 404;
        }
    }
}
