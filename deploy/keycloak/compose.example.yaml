# Preparation only. No host, realm, SMTP account or administrator is provisioned.
# Supply digest-pinned images and secrets outside the source tree.
services:
  identity:
    image: ${TRAVAUX_KEYCLOAK_IMAGE:?Set the verified Keycloak 26.8.2 image with sha256 digest}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${TRAVAUX_KEYCLOAK_DB_PASSWORD:?Supply the database password from the secret store}
      KC_HOSTNAME: ${TRAVAUX_KEYCLOAK_PUBLIC_ORIGIN:?Set the exact HTTPS identity origin}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${TRAVAUX_KEYCLOAK_PROXY_ADDRESSES:?Set only the actual reverse proxy addresses}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TRAVAUX_KEYCLOAK_BOOTSTRAP_USER:?Supply a temporary bootstrap administrator}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TRAVAUX_KEYCLOAK_BOOTSTRAP_PASSWORD:?Supply the temporary password from the secret store}
      TRAVAUX_TEST_PUBLIC_ORIGIN: ${TRAVAUX_TEST_PUBLIC_ORIGIN:?Set the exact HTTPS Travaux test origin}
    volumes:
      - ./realm-test.example.json:/opt/keycloak/data/import/travaux-test-realm.json:ro
      - identity-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      identity-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: "1.5"
    restart: unless-stopped
    networks: [identity-front, identity-database]
  identity-db:
    image: ${TRAVAUX_KEYCLOAK_POSTGRES_IMAGE:?Set a verified supported PostgreSQL image with sha256 digest}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${TRAVAUX_KEYCLOAK_DB_PASSWORD:?Supply the database password from the secret store}
    volumes:
      - identity-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    networks: [identity-database]
networks:
  identity-front: {}
  identity-database:
    internal: true
volumes:
  identity-data: {}
  identity-postgres: {}
