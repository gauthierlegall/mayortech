name: Verify pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, Node24
        with:
          version: "0.11.27"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra exchange --extra documents --extra appflowy
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen pytest deploy/hetzner/tests -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node24
        with:
          node-version: "22"
      - run: node --test web/tests/model.test.mjs web/tests/mail.test.mjs web/tests/workspace.test.mjs
      - run: npm ci --ignore-scripts
        working-directory: native-editor
      - run: npm test
        working-directory: native-editor
      - run: npm run build
        working-directory: native-editor
      - run: uv build
